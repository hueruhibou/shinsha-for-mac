<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17191d"><title>真写 for Mac</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{color-scheme:dark;--bg:#17191d;--panel:#22252a;--panel2:#2b2f36;--line:#3b414a;--text:#f3f4f6;--muted:#a3aab5;--accent:#dfe6f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-width:720px}.app{max-width:1600px;margin:auto;padding:26px 34px 40px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{font-size:27px;font-weight:760;letter-spacing:.12em;border:0;background:none;color:inherit;padding:0;cursor:pointer}.subtitle{font-size:10px;color:var(--muted);letter-spacing:.2em;margin-top:4px}.header-actions,.toolbar,.viewer-tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.btn,select{border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);padding:10px 14px;font:inherit}.btn{cursor:pointer}.btn.primary{background:#e5e9ef;color:#15171b;border-color:#e5e9ef;font-weight:700}.btn:disabled{opacity:.35;cursor:not-allowed}.status{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;margin:0 2px 14px}.toolbar{padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}.spacer{flex:1}.grid{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:13px}.tile{padding:0;position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#0f1114;cursor:pointer}.tile img{width:100%;height:100%;object-fit:contain;display:block}.tile:hover{border-color:#8993a2;transform:translateY(-2px)}.empty{border:1px dashed #515966;border-radius:18px;padding:68px 24px;text-align:center;color:var(--muted);line-height:1.9}.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:8px}.hint{font-size:12px;color:var(--muted);margin-top:12px}.hidden{display:none!important}input[type=file]{display:none}.viewer{position:fixed;inset:0;background:#08090b;z-index:20;display:flex;flex-direction:column;padding:12px 20px 18px}.viewer-head{height:54px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0}.viewer-brand{background:none;border:0;color:var(--text);font-size:18px;font-weight:750;letter-spacing:.1em;cursor:pointer}.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;flex:1;text-align:center}.iconbtn{min-width:42px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-size:17px;cursor:pointer}.viewer-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:grab;touch-action:none}.viewer-stage:active{cursor:grabbing}.viewer-stage img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;will-change:transform}.viewer-foot{display:flex;align-items:center;justify-content:center;gap:16px;padding-top:12px}.viewer-tools{justify-content:center}.zoom-label{font-size:12px;color:var(--muted);min-width:48px;text-align:center}.drop-overlay{position:fixed;inset:18px;z-index:40;border:2px dashed #e2e8f2;border-radius:24px;background:#17191df0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:700;pointer-events:none}.drop-overlay small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#e7eaf0;color:#151619;padding:11px 17px;border-radius:99px;font-size:12px;z-index:50;box-shadow:0 8px 30px #0008}.footer-note{color:var(--muted);font-size:11px;margin-top:18px;line-height:1.7}
</style></head><body><main class="app"><header><div><button class="brand" id="brandHome">真写</button><div class="subtitle">MIRROR PHOTO GALLERY · FOR MAC</div></div><div class="header-actions"><button class="btn" id="folderBtn">フォルダを追加</button><button class="btn primary" id="photoBtn">写真を追加</button><input id="photoInput" type="file" accept="image/*" multiple><input id="folderInput" type="file" accept="image/*" multiple webkitdirectory directory></div></header><div class="status"><span id="countLabel">写真を読み込み中…</span><span>Mac専用操作 · 写真はこのMacのブラウザ内に保存</span></div><div class="toolbar"><select id="orderSelect" aria-label="表示順"><option value="new">新しい順</option><option value="old">古い順</option><option value="shuffle">ランダム順</option></select><select id="colsSelect" aria-label="列数"><option value="4">4列</option><option value="5" selected>5列</option><option value="6">6列</option><option value="7">7列</option><option value="8">8列</option></select><span class="spacer"></span><button class="btn" id="flipBtn">一覧：反転 ON</button><button class="btn" id="clearBtn" disabled>ライブラリを消去</button></div><section class="grid" id="grid" style="--cols:5"></section><section class="empty" id="empty"><strong>写真をドラッグ＆ドロップ</strong>写真ファイルやフォルダをこの画面へドロップできます。<div class="hint">または「写真を追加」「フォルダを追加」から読み込んでください。<br>ショートカット：⌘O 追加 ／ ← → 前後 ／ F 反転 ／ + − 拡大 ／ 0 リセット ／ Esc 閉じる</div></section><div class="footer-note">読み込んだ写真はこのMacのブラウザ内に保存されます。元画像は変更されません。大切な写真は別途バックアップしてください。</div></main><section class="viewer hidden" id="viewer"><div class="viewer-head"><button class="iconbtn" id="closeViewer" aria-label="閉じる">×</button><button class="viewer-brand" id="viewerHome">真写</button><span class="counter" id="viewerCounter"></span><span class="zoom-label" id="zoomLabel">100%</span></div><div class="viewer-stage" id="stage"><img id="largeImage" alt="選択した写真"></div><div class="viewer-foot"><div class="viewer-tools"><button class="iconbtn" id="prevBtn" aria-label="前の写真">‹</button><button class="btn" id="viewerFlip">水平反転：ON</button><button class="btn" id="zoomOut">−</button><button class="btn" id="zoomReset">100%</button><button class="btn" id="zoomIn">＋</button><button class="btn" id="downloadBtn">画像を保存</button><button class="iconbtn" id="nextBtn" aria-label="次の写真">›</button></div></div></section><div class="drop-overlay hidden" id="dropOverlay">ここに写真・フォルダをドロップ<small>このMacの真写ライブラリに追加します</small></div><div class="toast hidden" id="toast"></div><script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const DB_NAME='shinsha-mac-library', LEGACY_DB='shinsha-local-library', STORE='photos';
let db=null, photos=[], order=[], currentPosition=0, listFlip=true, viewerFlip=true, zoom=1, offsetX=0, offsetY=0, toastTimer=null, dragDepth=0, initialization=Promise.resolve();
const grid=$('grid'),viewer=$('viewer'),stage=$('stage'),large=$('largeImage');
const toast=message=>{const node=$('toast');node.textContent=message;node.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.add('hidden'),2800)};
const currentRecord=()=>photos[order[currentPosition]];
const safeName=name=>(name||'shinsha-photo').replace(/[\\/:*?"<>|]/g,'_');
const shuffle=list=>{const result=[...list];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result};
function updateEmpty(){const has=photos.length>0;$('empty').classList.toggle('hidden',has);grid.classList.toggle('hidden',!has);$('countLabel').textContent=has?`${photos.length.toLocaleString()} 枚の写真`:'写真はまだありません';$('clearBtn').disabled=!has;}
function applyOrder(){const ids=photos.map((_,i)=>i);const mode=$('orderSelect').value;order=mode==='shuffle'?shuffle(ids):ids.sort((a,b)=>{const delta=(photos[a].added||0)-(photos[b].added||0);return mode==='old'?delta:-delta});currentPosition=0;renderGrid();}
function renderGrid(){grid.innerHTML='';grid.style.setProperty('--cols',String(Number($('colsSelect')?.value||3)));order.forEach((photoIndex,position)=>{const record=photos[photoIndex];const card=document.createElement('button');card.className='tile';card.type='button';card.title=record.name;const img=document.createElement('img');img.src=record.url;img.alt=record.name;img.style.transform=listFlip?'scaleX(-1)':'none';card.append(img);card.addEventListener('click',()=>openViewer(position));grid.append(card)});updateEmpty();}
function openDatabase(){return new Promise((resolve,reject)=>{const request=indexedDB.open(DB_NAME,1);request.onupgradeneeded=()=>{const database=request.result;if(!database.objectStoreNames.contains(STORE))database.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error('保存領域を開けません'))})}
function getAllRecords(database,name){return new Promise((resolve,reject)=>{if(!database.objectStoreNames.contains(name)){resolve([]);return}const tx=database.transaction(name,'readonly'),request=tx.objectStore(name).getAll();request.onsuccess=()=>resolve(request.result||[]);request.onerror=()=>reject(request.error||new Error('写真を読み込めません'))})}
function putRecords(records){return new Promise((resolve,reject)=>{if(!records.length){resolve([]);return}const tx=db.transaction(STORE,'readwrite'),store=tx.objectStore(STORE),ids=[];records.forEach(record=>{const request=store.add(record);request.onsuccess=()=>ids.push(request.result)});tx.oncomplete=()=>resolve(ids);tx.onerror=()=>reject(tx.error||new Error('保存に失敗しました'));tx.onabort=()=>reject(tx.error||new Error('保存が中断されました'))})}
async function tryLegacyMigration(){
  const flag=`${DB_NAME}:legacy-v11-migrated`;if(localStorage.getItem(flag)==='yes')return;
  try{
    if(indexedDB.databases){const known=await indexedDB.databases();if(!known.some(item=>item.name===LEGACY_DB)){localStorage.setItem(flag,'yes');return}}
    const request=indexedDB.open(LEGACY_DB);
    const legacy=await new Promise((resolve,reject)=>{request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);request.onupgradeneeded=()=>{request.transaction.abort()}}).catch(()=>null);
    if(!legacy){localStorage.setItem(flag,'yes');return}
    const records=await getAllRecords(legacy,STORE);legacy.close();
    const copies=records.map(record=>({name:record.name||'写真',added:record.added||Date.now(),blob:record.blob||record.file})).filter(record=>record.blob&&record.blob.type&&record.blob.type.startsWith('image/'));
    if(copies.length){await putRecords(copies);toast(`以前の真写から ${copies.length} 枚を引き継ぎました`)}
    localStorage.setItem(flag,'yes');
  }catch(error){console.warn('Legacy migration skipped',error)}
}
async function init(){
  try{db=await openDatabase();await tryLegacyMigration();const records=await getAllRecords(db,STORE);records.sort((a,b)=>(a.added||0)-(b.added||0));photos=records.filter(r=>r.blob&&r.blob.type&&r.blob.type.startsWith('image/')).map(r=>({...r,url:URL.createObjectURL(r.blob)}));if(navigator.storage?.persist){try{await navigator.storage.persist()}catch{}}
  }catch(error){console.error(error);db=null;toast('端末保存を利用できません。読み込んだ写真は一時表示になります')}
  applyOrder();
}
async function addFiles(fileList){await initialization;const files=[...fileList].filter(file=>file&&file.type&&file.type.startsWith('image/'));if(!files.length){toast('画像ファイルが見つかりませんでした');return}
  const base=Date.now();const records=files.map((file,index)=>({name:file.webkitRelativePath||file.name||`写真 ${index+1}`,added:base+index,blob:file}));
  if(db){try{const ids=await putRecords(records);records.forEach((record,index)=>photos.push({...record,id:ids[index],url:URL.createObjectURL(record.blob)}));}catch(error){console.error(error);toast('保存できませんでした。端末の空き容量を確認してください');return}}
  else records.forEach(record=>photos.push({...record,url:URL.createObjectURL(record.blob)}));
  applyOrder();toast(db?`${files.length} 枚を端末内に保存しました`:`${files.length} 枚を一時読み込みしました`);
}
function resetZoom(){zoom=1;offsetX=0;offsetY=0;paintImage()}
function paintImage(){const flip=viewerFlip?-1:1;large.style.transform=`translate3d(${offsetX}px,${offsetY}px,0) scaleX(${flip}) scale(${zoom})`;const label=$('zoomLabel');if(label)label.textContent=`${Math.round(zoom*100)}%`}
function openViewer(position){currentPosition=position;viewerFlip=true;resetZoom();renderViewer();viewer.classList.remove('hidden');document.body.classList.add('viewing');}
function renderViewer(){const record=currentRecord();if(!record)return;large.src=record.url;large.alt=record.name;paintImage();$('viewerCounter').textContent=`${currentPosition+1} / ${order.length}　${record.name}`;$('viewerFlip').textContent=`水平反転：${viewerFlip?'ON':'OFF'}`;$('prevBtn').disabled=order.length<2;$('nextBtn').disabled=order.length<2;}
function closeViewer(){viewer.classList.add('hidden');document.body.classList.remove('viewing')}
function move(delta){if(!order.length)return;currentPosition=(currentPosition+delta+order.length)%order.length;resetZoom();renderViewer()}
function zoomBy(factor){zoom=Math.max(1,Math.min(6,zoom*factor));if(zoom===1){offsetX=0;offsetY=0}paintImage()}
function downloadCurrent(){const record=currentRecord();if(!record)return;const link=document.createElement('a');link.href=record.url;link.download=safeName(record.name);document.body.append(link);link.click();link.remove();toast('元画像の保存を開始しました')}
async function clearLibrary(){if(!photos.length)return;if(!confirm('この真写アプリ内に保存した写真をすべて削除しますか？\n元の写真ファイルは削除されません。'))return;try{if(db)await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});photos.forEach(record=>URL.revokeObjectURL(record.url));photos=[];order=[];closeViewer();renderGrid();toast('このアプリ内の写真を削除しました')}catch(error){console.error(error);toast('削除できませんでした')}}
function goHome(){closeViewer();window.scrollTo({top:0,behavior:'smooth'})}
function renderOrderControls(){$('directionSelect')?.classList.toggle('hidden',$('orderSelect').value==='shuffle')}
$('brandHome').addEventListener('click',goHome);$('viewerHome').addEventListener('click',goHome);$('closeViewer').addEventListener('click',closeViewer);
$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));$('viewerFlip').addEventListener('click',()=>{viewerFlip=!viewerFlip;renderViewer()});$('downloadBtn').addEventListener('click',downloadCurrent);$('zoomIn').addEventListener('click',()=>zoomBy(1.25));$('zoomOut').addEventListener('click',()=>zoomBy(.8));$('zoomReset').addEventListener('click',resetZoom);
$('photoBtn').addEventListener('click',()=>$('photoInput').click());$('photoInput').addEventListener('change',event=>{addFiles(event.target.files);event.target.value=''});$('clearBtn').addEventListener('click',clearLibrary);
$('orderSelect').addEventListener('change',()=>{renderOrderControls();applyOrder()});$('directionSelect')?.addEventListener('change',applyOrder);$('colsSelect')?.addEventListener('change',renderGrid);
$('flipBtn')?.addEventListener('click',()=>{listFlip=!listFlip;$('flipBtn').textContent=`一覧：反転 ${listFlip?'ON':'OFF'}`;renderGrid()});
document.addEventListener('keydown',event=>{if(viewer.classList.contains('hidden')){if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='o'){event.preventDefault();$('photoInput').click()}return}if(event.key==='Escape'){closeViewer();return}if(event.key==='ArrowRight'){event.preventDefault();move(1)}if(event.key==='ArrowLeft'){event.preventDefault();move(-1)}if(event.key.toLowerCase()==='f'){viewerFlip=!viewerFlip;renderViewer()}if(event.key==='+'||event.key==='=')zoomBy(1.2);if(event.key==='-')zoomBy(.83);if(event.key==='0')resetZoom()});
function installSW(){if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(error=>console.warn('Service worker registration failed',error)))}

// Mac: native-style file/folder import and mouse/trackpad zoom + pan.
$('folderBtn').addEventListener('click',()=>$('folderInput').click());
$('folderInput').addEventListener('change',event=>{addFiles(event.target.files);event.target.value=''});
async function entryFiles(entry){
 if(entry.isFile)return new Promise(resolve=>entry.file(file=>resolve([file]),()=>resolve([])));
 if(entry.isDirectory){const reader=entry.createReader(),all=[];while(true){const batch=await new Promise(resolve=>reader.readEntries(resolve,()=>resolve([])));if(!batch.length)break;all.push(...batch)}const children=await Promise.all(all.map(entryFiles));return children.flat()}
 return [];
}
async function extractDrop(data){const items=[...(data.items||[])],entries=items.map(item=>item.webkitGetAsEntry?.()).filter(Boolean);if(entries.length){const groups=await Promise.all(entries.map(entryFiles));return groups.flat()}return [...(data.files||[])]}
document.addEventListener('dragenter',event=>{event.preventDefault();dragDepth++;$('dropOverlay').classList.remove('hidden')});
document.addEventListener('dragover',event=>{event.preventDefault();if(event.dataTransfer)event.dataTransfer.dropEffect='copy'});
document.addEventListener('dragleave',event=>{event.preventDefault();dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('dropOverlay').classList.add('hidden')});
document.addEventListener('drop',async event=>{event.preventDefault();dragDepth=0;$('dropOverlay').classList.add('hidden');try{await addFiles(await extractDrop(event.dataTransfer))}catch(error){console.error(error);toast('ドロップしたファイルを読み込めませんでした')}});
let pointer=null;
stage.addEventListener('wheel',event=>{event.preventDefault();zoomBy(event.deltaY<0?1.12:.89)},{passive:false});
stage.addEventListener('pointerdown',event=>{if(event.button!==0||zoom<=1)return;pointer={x:event.clientX,y:event.clientY,lastX:event.clientX,lastY:event.clientY};stage.setPointerCapture?.(event.pointerId)});
stage.addEventListener('pointermove',event=>{if(!pointer)return;offsetX+=event.clientX-pointer.lastX;offsetY+=event.clientY-pointer.lastY;pointer.lastX=event.clientX;pointer.lastY=event.clientY;paintImage()});
['pointerup','pointercancel','lostpointercapture'].forEach(type=>stage.addEventListener(type,()=>pointer=null));

initialization=init();installSW();
})();
</script></body></html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151619">
<title>真写 — Mirror Photo Gallery</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="真写">\n<meta name="format-detection" content="telephone=no">
<style>
:root{color-scheme:dark;--bg:#151619;--panel:#202226;--panel2:#292c31;--line:#343840;--text:#f1f2f4;--muted:#9da3ad;--accent:#dce2ec}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior-x:none} body{touch-action:pan-y}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.app{max-width:1100px;margin:auto;padding:18px 16px 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-size:23px;font-weight:700;letter-spacing:.12em}.sub{font-size:10px;color:var(--muted);letter-spacing:.16em;margin-top:3px}
.actions,.toolbar,.viewer-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:13px}
.btn.primary{background:#e7eaf0;color:#17191d;border-color:#e7eaf0;font-weight:650}
.btn:disabled{opacity:.35;cursor:not-allowed}
.status{color:var(--muted);font-size:12px;margin:8px 2px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toolbar{background:var(--panel);border:1px solid var(--line);padding:9px;border-radius:15px;margin-bottom:14px}
.toolbar .spacer{flex:1}
select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:5px;touch-action:pan-y}
.tile{position:relative;aspect-ratio:1/1;background:#24272c;border-radius:5px;overflow:hidden;padding:0;touch-action:pan-y}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
.tile:active{opacity:.8}.empty{border:1px dashed #454a54;border-radius:18px;padding:42px 20px;text-align:center;color:var(--muted);line-height:1.8}
.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:8px}
.hidden{display:none!important}
.viewer{position:fixed;inset:0;background:#090a0c;z-index:10;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.viewer-head{height:52px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.viewer-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.viewer-stage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;pointer-events:none;will-change:transform}
.viewer-foot{padding:12px 0 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
.viewer-controls{justify-content:center}.hint{font-size:11px;color:var(--muted);text-align:center}
.iconbtn{width:42px;height:42px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);font-size:18px}
.counter{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#e7eaf0;color:#151619;padding:10px 15px;border-radius:99px;font-size:12px;z-index:30;box-shadow:0 8px 30px #0008}
input[type=file]{display:none}
@media(min-width:700px){.app{padding:26px 24px}.grid{gap:8px}.tile{border-radius:8px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div><div class="brand">真写</div><div class="sub">MIRROR PHOTO GALLERY</div></div>
    <div class="actions">
      <button class="btn" id="folderBtn">フォルダ</button>
      <button class="btn primary" id="photoBtn">写真を選択</button>
      <input id="photoInput" type="file" accept="image/*" multiple aria-label="写真ライブラリから画像を複数選択">
      <input id="folderInput" type="file" accept="image/*" multiple webkitdirectory directory>
    </div>
  </header>
  <div class="status"><span id="countLabel">写真はまだありません</span><span id="storageLabel">写真はこの端末内で処理されます</span></div>
  <div class="toolbar">
    <select id="orderSelect" aria-label="表示順"><option value="date">通常順（追加順）</option><option value="shuffle">ランダム順（重複なし）</option></select>
    <select id="directionSelect" aria-label="通常順の方向"><option value="new">新しい順</option><option value="old">古い順</option></select>
    <span class="spacer"></span>
    <button class="btn" id="flipBtn">一覧：反転 ON</button>
    <button class="btn" id="clearBtn">一覧を消去</button>
  </div>
  <div class="grid" id="grid" style="--cols:3"></div>
  <div class="empty" id="empty"><strong>写真を読み込んでください</strong>「写真を追加」または「フォルダ」から画像を選択できます。<br>一覧は左右反転して表示されます。</div>
</div>
<div class="viewer hidden" id="viewer">
  <div class="viewer-head">
    <button class="iconbtn" id="closeViewer" aria-label="閉じる">×</button>
    <span class="counter" id="viewerCounter"></span>
    <button class="iconbtn" id="viewerMenu" aria-label="表示切替">⋯</button>
  </div>
  <div class="viewer-stage" id="stage"><img id="largeImage" alt="選択した写真"></div>
  <div class="viewer-foot">
    <div class="viewer-controls">
      <button class="iconbtn" id="prevBtn" aria-label="前の写真">‹</button>
      <button class="btn" id="viewerFlip">水平反転：ON</button>
      <button class="iconbtn" id="nextBtn" aria-label="次の写真">›</button>
    </div>
    <div class="hint">左右スワイプ：写真移動　／　ピンチ：拡大・縮小</div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
let photos=[],order=[],index=0,viewerFlip=true,listFlip=true,cols=3,toastTimer;
const grid=$('grid'),empty=$('empty'),viewer=$('viewer'),large=$('largeImage');
const showToast=msg=>{const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)};
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function current(){return order[index]}
function updateStatus(){
 $('countLabel').textContent=photos.length?`${photos.length.toLocaleString()} 枚の写真`:'写真はまだありません';
 $('empty').classList.toggle('hidden',photos.length>0);
 $('grid').classList.toggle('hidden',photos.length===0);
 $('storageLabel').textContent='写真は端末内で処理・保存されます';
}
function makeOrder(){
 const ids=photos.map((_,i)=>i);
 order=$('orderSelect').value==='shuffle'?shuffle(ids):ids.sort((a,b)=>{
  const d=photos[a].added-photos[b].added;return $('directionSelect').value==='old'?d:-d;
 });
 index=0;renderGrid();
}
function renderGrid(){
 grid.style.setProperty('--cols',cols);grid.innerHTML='';
 order.forEach((photoIndex,position)=>{
  const p=photos[photoIndex],button=document.createElement('button');button.className='tile';button.title=p.name;
  const img=document.createElement('img');img.src=p.url;img.alt=p.name;img.style.transform=listFlip?'scaleX(-1)':'none';
  button.appendChild(img);button.addEventListener('click',()=>openViewer(position));grid.appendChild(button);
 });
 updateStatus();
}
function addFiles(files){
 const incoming=[...files].filter(f=>f.type.startsWith('image/'));
 if(!incoming.length){showToast('画像ファイルが見つかりませんでした');return}
 let added=0;
 incoming.forEach(file=>{
  const url=URL.createObjectURL(file);
  photos.push({file,url,name:file.name||'写真',added:Date.now()+added++});
 });
 makeOrder();showToast(`${incoming.length}枚を読み込みました`);
}
function openViewer(position){index=position;viewerFlip=true;resetZoom();renderViewer();viewer.classList.remove('hidden')}
function renderViewer(){
 const p=photos[current()];if(!p)return;
 large.src=p.url;paintImage();
 $('viewerCounter').textContent=`${index+1} / ${order.length}　${p.name}`;
 $('viewerFlip').textContent=`水平反転：${viewerFlip?'ON':'OFF'}`;
 $('prevBtn').disabled=order.length<2;$('nextBtn').disabled=order.length<2;
}
function move(delta){if(!order.length)return;index=(index+delta+order.length)%order.length;resetZoom();renderViewer()}
$('photoBtn').onclick=()=>$('photoInput').click();
$('folderBtn').onclick=()=>$('folderInput').click();
$('photoInput').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('folderInput').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('orderSelect').onchange=makeOrder;$('directionSelect').onchange=()=>{if($('orderSelect').value==='date')makeOrder()};
$('flipBtn').onclick=()=>{listFlip=!listFlip;$('flipBtn').textContent=`一覧：反転 ${listFlip?'ON':'OFF'}`;renderGrid()};
$('clearBtn').onclick=()=>{if(!photos.length)return;if(!confirm('読み込んだ写真を一覧から削除しますか？'))return;photos.forEach(p=>URL.revokeObjectURL(p.url));photos=[];order=[];renderGrid()};
$('closeViewer').onclick=()=>viewer.classList.add('hidden');
$('viewerFlip').onclick=()=>{viewerFlip=!viewerFlip;renderViewer()};
$('viewerMenu').onclick=()=>{viewerFlip=!viewerFlip;renderViewer()};
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
let scale=1,tx=0,ty=0,gesture='',startX=0,startY=0,lastX=0,lastY=0;
let pinchStart=1,startDist=0,startTx=0,startTy=0,startMidX=0,startMidY=0;
function distance(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}
function midpoint(t){return {x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2}}
function paintImage(){large.style.transform=`translate3d(${tx}px,${ty}px,0) scaleX(${viewerFlip?-1:1}) scale(${scale})`}
function resetZoom(){scale=1;tx=0;ty=0;paintImage()}
const stage=$('stage');
stage.addEventListener('touchstart',e=>{
 if(e.touches.length===2){
  gesture='pinch';startDist=distance(e.touches);pinchStart=scale;startTx=tx;startTy=ty;
  const m=midpoint(e.touches),r=stage.getBoundingClientRect();
  startMidX=m.x-(r.left+r.width/2);startMidY=m.y-(r.top+r.height/2);
 }else if(e.touches.length===1){
  const t=e.touches[0];startX=lastX=t.clientX;startY=lastY=t.clientY;
  gesture=scale>1?'pan':'swipe';
 }
},{passive:true});
stage.addEventListener('touchmove',e=>{
 if(gesture==='pinch'&&e.touches.length===2){
  e.preventDefault();
  const ratio=distance(e.touches)/Math.max(1,startDist);
  const next=Math.max(1,Math.min(5,pinchStart*ratio));
  const m=midpoint(e.touches),r=stage.getBoundingClientRect();
  const mx=m.x-(r.left+r.width/2),my=m.y-(r.top+r.height/2);
  const imageX=(startMidX-startTx)/pinchStart,imageY=(startMidY-startTy)/pinchStart;
  tx=mx-imageX*next;ty=my-imageY*next;scale=next;
  if(scale===1){tx=0;ty=0}
  paintImage();
 }else if(gesture==='pan'&&e.touches.length===1){
  e.preventDefault();const t=e.touches[0];tx+=t.clientX-lastX;ty+=t.clientY-lastY;lastX=t.clientX;lastY=t.clientY;paintImage();
 }
},{passive:false});
stage.addEventListener('touchend',e=>{
 if(e.touches.length===1){
  const t=e.touches[0];lastX=startX=t.clientX;lastY=startY=t.clientY;
  gesture=scale>1?'pan':'swipe';
 }else if(e.touches.length===0){
  if(gesture==='swipe'&&e.changedTouches.length){
   const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;
   if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))move(dx<0?1:-1);
  }
  gesture='';
 }
},{passive:true});
stage.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();scale=Math.max(1,Math.min(5,scale+(e.deltaY<0?.15:-.15)));if(scale===1){tx=0;ty=0}paintImage()}},{passive:false});
let gridPinchStart=0,gridColsStart=3;
grid.addEventListener('touchstart',e=>{if(e.touches.length===2){gridPinchStart=distance(e.touches);gridColsStart=cols}},{passive:true});
grid.addEventListener('touchend',e=>{if(gridPinchStart&&e.changedTouches.length){const end=gridPinchStart;/* use pinch movement captured below */}gridPinchStart=0},{passive:true});
grid.addEventListener('touchmove',e=>{
 if(e.touches.length===2&&gridPinchStart){const d=distance(e.touches),ratio=d/gridPinchStart;let next=gridColsStart;if(ratio>1.22)next=Math.max(2,gridColsStart-1);if(ratio<.82)next=Math.min(6,gridColsStart+1);if(next!==cols){cols=next;grid.style.setProperty('--cols',cols)}}
},{passive:true});
grid.addEventListener('touchend',()=>{if(gridPinchStart){gridPinchStart=0;renderGrid()}},{passive:true});
let pointerStart=null;
grid.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();cols=Math.max(2,Math.min(6,cols+(e.deltaY>0?1:-1)));renderGrid()}},{passive:false});
document.addEventListener('keydown',e=>{if(viewer.classList.contains('hidden'))return;if(e.key==='Escape')viewer.classList.add('hidden');if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});
makeOrder();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registration failed', err));
  });
}
})();
</script>
</body>
</html>
